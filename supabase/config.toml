# 04/08/2026 (GT-13) - upload-midia estava com verify_jwt=true no projeto e um deploy meu com
# --no-verify-jwt mudou isso para false. O flag da CLI so sabe DESLIGAR; sem uma declaracao aqui
# o valor anterior nao volta sozinho.
# 11/08/2026 - cron horario escoar_imagens chama esta edge com x-mcp-key (a propria edge
# autentica via mcp_key_valida). Mesmo padrao de drive-audio-transcribe / pipeboard-metrics-sync:
# gateway aberto, autenticacao dentro. verify_jwt=false e obrigatorio para o cron nao depender
# de JWT de anon/service_role no agendador.
[functions.upload-midia]
verify_jwt = false

# ESP-12: chamada interna pelo cron usa x-mcp-key e a propria edge valida via mcp_key_valida.
[functions.drive-audio-transcribe]
verify_jwt = false

# ditado do chat (Bearer do usuario) E chamada interna da drive-audio-transcribe (x-mcp-key,
# sem Authorization). Precisa continuar com o gateway aberto - a propria edge autentica.
[functions.transcribe-audio]
verify_jwt = false

# Fase A: cron autentica por mcp_key_valida dentro da edge.
[functions.pipeboard-metrics-sync]
verify_jwt = false

# Sonda de identidade (somente leitura). Sem esta linha o deploy nasce com verify_jwt=true
# e o gateway rejeita a x-mcp-key antes de a edge validar — a propria edge autentica por
# mcp_key_valida, como as demais.
[functions.meta-identity-probe]
verify_jwt = false

# ESP-37: traffic-chat chama com x-mcp-key; a propria edge autentica via mcp_key_valida.
[functions.gerar-legendas]
verify_jwt = false

# ESP-30: monitor de expiracao/escopo dos tokens Meta. Cron chama com x-mcp-key; a propria
# edge autentica via mcp_key_valida. Mesmo padrao de bm-monitor/meta-identity-probe.
[functions.meta-token-monitor]
verify_jwt = false
